<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Forme dell'Energia ed Esempi Quotidiani</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #2e7d32;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 95vw;
            height: 95vh;
            background-color: #4caf50;
            border: 4px solid #ffffff;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 {
            color: #ffffff;
            text-align: center;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        .image-box {
            background-color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            max-width: 900px;
            width: 100%;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .image-box img {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .nav-links a {
            background-color: #ffffff;
            color: #2e7d32;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }
        .nav-links a:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Le Forme dell'Energia ed Esempi Quotidiani</h1>
        
        <div class="image-box">
            <!-- Sostituisci l'attributo src con il link dell'immagine o carica l'immagine nella cartella -->
            <img src="https://via.placeholder.com/850x450.png?text=Inserire+qui+il+collage+delle+fonti+energetiche" alt="Le Forme dell'Energia">
        </div>

        <div class="nav-links">
            <a href="#rinnovabili">Fonti Rinnovabili</a>
            <a href="#non-rinnovabili">Fonti Non Rinnovabili</a>
        </div>
    </div>

</body>
</html>
